name: Deploy to GitHub Pages

# Deploy policy:
#   main branch    -> site root  (https://tsybriki.github.io/ninja-frog/)
#   other branches -> /<branch>/ (https://tsybriki.github.io/ninja-frog/<branch>/)
#
# main keeps the canonical URL; every other branch gets its own subfolder
# so URLs never collide.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Serialize deploys so concurrent branch pushes don't clobber each other.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          # Empty destination_dir = gh-pages root. Non-main branches go to /<branch>/.
          destination_dir: ${{ github.ref_name == 'main' && '' || github.ref_name }}
          keep_files: true
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com