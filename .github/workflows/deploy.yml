name: Deploy to GitHub Pages

# Deploy every pushed branch into a subfolder of the `gh-pages` branch.
# Resulting URLs:
#   main branch         -> https://tsybriki.github.io/ninja-frog/
#   random-sikness      -> https://tsybriki.github.io/ninja-frog/random-sikness/
#   any other branch    -> https://tsybriki.github.io/ninja-frog/<branch>/
#
# Each branch lives under its own folder in the gh-pages branch so URLs
# never collide. A concurrency group serializes the writes so concurrent
# branch pushes don't race.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Serialize deploys so two branches pushing at once don't clobber each other.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Deploy branch to gh-pages/<branch>
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com