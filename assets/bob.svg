<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffb3c1"/>
      <stop offset="40%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#e25c75"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ffe4ea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="eyeShine" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%"  stop-color="#fff"/>
      <stop offset="80%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3" result="b"/>
      <feComponentTransfer in="b"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Drop shadow on the floor -->
  <ellipse cx="110" cy="200" rx="60" ry="7" fill="rgba(0,0,0,0.18)"/>

  <!-- TAIL FAN (behind body) -->
  <g filter="url(#softShadow)">
    <path d="M 145,108 Q 178,80  198,82 Q 195,98 170,108 Z"
          fill="#ff7a8f" stroke="#a8253d" stroke-width="1.4"/>
    <path d="M 148,112 Q 178,110 196,118 Q 184,128 162,128 Z"
          fill="#ffb3c1" stroke="#a8253d" stroke-width="1.4"/>
    <path d="M 145,118 Q 175,138 188,148 Q 170,150 152,140 Z"
          fill="#ff5a7c" stroke="#a8253d" stroke-width="1.4"/>
  </g>

  <!-- LEGS (behind body, peeking out) -->
  <g stroke="#a8253d" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 96,148 Q 88,164 82,170"/>
    <path d="M 112,150 Q 112,166 110,174"/>
    <path d="M 128,148 Q 130,164 132,170"/>
  </g>

  <!-- BODY -->
  <g filter="url(#softShadow)">
    <path d="M 60,108
             C 46,78   90,62   124,68
             C 162,76  172,98  168,124
             C 162,148 130,156 100,154
             C 76,150  64,134 60,108 Z"
          fill="url(#bodyGrad)" stroke="#a8253d" stroke-width="1.8"/>
    <!-- Belly highlight -->
    <path d="M 80,134
             C 96,148 132,148 152,130
             C 148,144 130,150 108,150
             C 92,150  82,144 80,134 Z"
          fill="url(#bellyGrad)"/>
    <!-- Body segments -->
    <path d="M 88,80  Q 84,112 92,150" stroke="#c43651" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M 114,72 Q 114,112 116,154" stroke="#c43651" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M 140,82 Q 144,112 142,148" stroke="#c43651" stroke-width="1" fill="none" opacity="0.55"/>
  </g>

  <!-- HEAD -->
  <g filter="url(#softShadow)">
    <ellipse cx="64" cy="104" rx="26" ry="22" fill="url(#bodyGrad)" stroke="#a8253d" stroke-width="1.8"/>
    <!-- Cheek blush -->
    <ellipse cx="58" cy="116" rx="8" ry="4" fill="#ff9eb0" opacity="0.75"/>
  </g>

  <!-- EYES (large kawaii-style) -->
  <g>
    <!-- White -->
    <ellipse cx="58" cy="100" rx="8" ry="10" fill="#fff" stroke="#1d1d1d" stroke-width="1"/>
    <ellipse cx="78" cy="96"  rx="8" ry="10" fill="#fff" stroke="#1d1d1d" stroke-width="1"/>
    <!-- Pupils (looking forward+up) -->
    <ellipse cx="59" cy="100" rx="4.5" ry="6.5" fill="#1d1d1d"/>
    <ellipse cx="79" cy="96"  rx="4.5" ry="6.5" fill="#1d1d1d"/>
    <!-- Catchlights -->
    <circle cx="60" cy="97" r="2" fill="#fff"/>
    <circle cx="80" cy="93" r="2" fill="#fff"/>
    <circle cx="57" cy="103" r="0.8" fill="#fff" opacity="0.7"/>
    <circle cx="77" cy="99"  r="0.8" fill="#fff" opacity="0.7"/>
  </g>

  <!-- SMILE -->
  <path d="M 50,118 Q 60,128 72,118" stroke="#7a1024" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 53,118 Q 60,123 67,119" fill="#ff9eb0" opacity="0.55"/>

  <!-- ANTENNAE -->
  <g stroke="#a8253d" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 50,90 Q 36,72 24,52"/>
    <path d="M 64,86 Q 60,68 56,46"/>
    <circle cx="24" cy="52" r="3" fill="#a8253d"/>
    <circle cx="56" cy="46" r="3" fill="#a8253d"/>
    <!-- shine on bobbles -->
    <circle cx="23" cy="51" r="1" fill="#fff"/>
    <circle cx="55" cy="45" r="1" fill="#fff"/>
  </g>

  <!-- SPARKLES -->
  <g fill="#fff" opacity="0.9">
    <path d="M 90,80 l 2,3 -2,3 -2,-3 z"/>
    <path d="M 138,90 l 1.5,2.5 -1.5,2.5 -1.5,-2.5 z"/>
    <path d="M 156,140 l 1,2 -1,2 -1,-2 z"/>
  </g>
</svg>
