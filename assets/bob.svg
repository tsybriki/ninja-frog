<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Body gradient: deep coral to soft pink -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff8da1"/>
      <stop offset="55%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#e63950"/>
    </linearGradient>
    <!-- Belly highlight -->
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffd1d8" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ffe4ea" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff0f3" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Shadow blur -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="3" result="b"/>
      <feComponentTransfer in="b"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Drop shadow under shrimp -->
  <ellipse cx="100" cy="180" rx="55" ry="6" fill="rgba(0,0,0,0.18)"/>

  <!-- Tail fan (drawn first so it's behind the body) -->
  <g transform="translate(140,108)" filter="url(#softShadow)">
    <path d="M 0,0 Q 30,-22 50,-18 Q 38,-4 32,4 Z" fill="#ff6b8a" stroke="#c43651" stroke-width="1.4"/>
    <path d="M 0,0 Q 28,-6 48,2  Q 38,12 30,14 Z" fill="#ff8da1" stroke="#c43651" stroke-width="1.2"/>
    <path d="M 0,0 Q 24,10 38,20  Q 26,22 18,18 Z" fill="#ff5a7c" stroke="#c43651" stroke-width="1.2"/>
  </g>

  <!-- Two thin legs under belly (legs 1) -->
  <g stroke="#c43651" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 95,140 Q 88,152 82,156"/>
    <path d="M 110,142 Q 108,154 106,160"/>
    <path d="M 124,142 Q 124,154 122,160"/>
  </g>

  <!-- Body — main shape -->
  <g filter="url(#softShadow)">
    <!-- Main body -->
    <path d="M 60,108
             C 50,82  90,68  120,72
             C 155,78 162,98 158,118
             C 152,140 125,148 100,146
             C 80,144  65,132 60,108 Z"
          fill="url(#bodyGrad)" stroke="#a8253d" stroke-width="1.6"/>
    <!-- Belly highlight -->
    <path d="M 78,128
             C 95,140 130,138 148,124
             C 145,134 130,142 110,142
             C 95,142  82,138 78,128 Z"
          fill="url(#bellyGrad)"/>

    <!-- Body segment lines (subtle) -->
    <path d="M 85,82 Q 82,108 86,142" stroke="#c43651" stroke-width="0.9" fill="none" opacity="0.55"/>
    <path d="M 110,74 Q 110,108 112,144" stroke="#c43651" stroke-width="0.9" fill="none" opacity="0.55"/>
    <path d="M 135,80 Q 140,108 138,140" stroke="#c43651" stroke-width="0.9" fill="none" opacity="0.55"/>
  </g>

  <!-- Head (left side of body) -->
  <g filter="url(#softShadow)">
    <ellipse cx="62" cy="104" rx="22" ry="20" fill="url(#bodyGrad)" stroke="#a8253d" stroke-width="1.6"/>
    <!-- Cheek blush -->
    <ellipse cx="55" cy="112" rx="6" ry="3.5" fill="#ff9eb0" opacity="0.7"/>
  </g>

  <!-- Eyes -->
  <g>
    <ellipse cx="56" cy="98" rx="3.5" ry="4.5" fill="#1d1d1d"/>
    <ellipse cx="58" cy="96" rx="1.2" ry="1.6" fill="#ffffff"/>
    <ellipse cx="55" cy="100" rx="0.7" ry="0.9" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Smile -->
  <path d="M 50,114 Q 56,118 62,113" stroke="#7a1024" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Antennae (two thin curves) -->
  <g stroke="#a8253d" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 50,90 Q 38,76 28,62"/>
    <path d="M 60,86 Q 56,68 50,52"/>
    <circle cx="28" cy="62" r="2" fill="#a8253d"/>
    <circle cx="50" cy="52" r="2" fill="#a8253d"/>
  </g>

  <!-- Small sparkle -->
  <g fill="#ffffff">
    <circle cx="78" cy="92" r="1.4"/>
    <circle cx="120" cy="86" r="1.1"/>
  </g>
</svg>
